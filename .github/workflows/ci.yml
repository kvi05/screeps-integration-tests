name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ── Lint & Format ──────────────────────────────────────────────────────
    lint:
        name: Lint & Format (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              id: setup-node
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Cache node_modules
              id: cache
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
            - if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
              env:
                  HUSKY: 0
            - run: npm run lint
            - run: npm run format:check

    # ── Unit tests ─────────────────────────────────────────────────────────
    unit-tests:
        name: Unit Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        needs: [lint]
        timeout-minutes: 10
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              id: setup-node
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Cache node_modules
              id: cache
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
            - if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
              env:
                  HUSKY: 0
            - name: Cache viewer client node_modules
              id: cache-viewer
              uses: actions/cache@v6
              with:
                  path: src/tools/viewer/client/node_modules
                  key: ${{ runner.os }}-viewer-${{ hashFiles('src/tools/viewer/client/package-lock.json') }}
            - name: Build viewer client
              run: npm run build:viewer
              env:
                  HUSKY: 0
            - run: npm test
            - run: npm run test:viewer

    # ── Integration tests (gated behind lint + unit) ───────────────────────
    integration-tests:
        name: Integration Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        needs: [lint]
        timeout-minutes: 15
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              id: setup-node
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Cache node_modules
              id: cache
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
            - if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
              env:
                  HUSKY: 0
            - run: npm run test:integration
