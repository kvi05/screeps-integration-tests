name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ── Install once per Node version, share node_modules via artifact ──────
    install:
        name: Install (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - uses: actions/upload-artifact@v6
              with:
                  name: node-modules-${{ matrix.node-version }}
                  path: node_modules

    # ── Lint & Format ──────────────────────────────────────────────────────
    lint:
        name: Lint & Format (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        needs: install
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: actions/download-artifact@v6
              with:
                  name: node-modules-${{ matrix.node-version }}
                  path: node_modules
            - run: npm run lint
            - run: npm run format:check

    # ── Unit tests ─────────────────────────────────────────────────────────
    unit-tests:
        name: Unit Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        needs: install
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: actions/download-artifact@v6
              with:
                  name: node-modules-${{ matrix.node-version }}
                  path: node_modules
            - run: npm test

    # ── Integration tests (gated behind lint + unit) ───────────────────────
    integration-tests:
        name: Integration Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        needs: [install, lint, unit-tests]
        timeout-minutes: 15
        strategy:
            matrix:
                node-version: ['22.x', '24.x']
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - uses: actions/download-artifact@v6
              with:
                  name: node-modules-${{ matrix.node-version }}
                  path: node_modules
            - run: npm run test:integration
